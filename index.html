<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101b26" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Skyline Rush" />
    <!-- black, not black-translucent: that style paints under the status bar and leaves an unpaintable bottom band on iOS standalone (WebKit 313800). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icons/app-icon.svg" />
    <meta name="description" content="A 3D coastal highway racer. Drive fast, fire your thrusters and take the race into the sky." />
    <title>Skyline Rush — Beyond the road</title>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_TW" />
    <meta property="og:url" content="https://weskao.github.io/skyline-rush/" />
    <meta property="og:title" content="Skyline Rush — Beyond the road" />
    <meta property="og:description" content="A 3D coastal highway racer. Drive fast, fire your thrusters and take the race into the sky." />
    <!-- One static English cover (crawlers cannot switch language): a copy of public/og-image.en.jpeg from scripts/capture-og-images.mjs; ?v= busts social-card caches when it changes -->
    <meta property="og:image" content="https://weskao.github.io/skyline-rush/og-image.jpeg?v=20261021a" />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="Skyline Rush start screen" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
