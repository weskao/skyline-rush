name: One-time track teaser crop and text cleanup
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/track-teaser-oneoff.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Repair only five teaser JPEGs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pillow opencv-python-headless
          git fetch origin feature/playable-frostbite-canyon
          python - <<'PY'
          import io
          import subprocess
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image

          DEST = Path("public/track-teasers")
          HISTORIC = "4b94bdabf9fa5030045646e04a45a4aef549edc3"
          R = Image.Resampling.LANCZOS

          def read(ref, path):
              return Image.open(io.BytesIO(subprocess.check_output(["git", "show", f"{ref}:{path}"]))).convert("RGB")

          def write(name, img):
              assert img.size == (568, 205), (name, img.size)
              assert img.mode == "RGB"
              # A full-frame white row/column is a layout artifact, not scene content.
              data = np.asarray(img)
              for edge in (data[0], data[-1], data[:, 0], data[:, -1]):
                  assert not np.all(edge >= 248), f"{name}: white border"
              output = DEST / (name + ".jpg")
              img.save(output, "JPEG", quality=89, subsampling=0, optimize=True)
              with Image.open(output) as checked:
                  assert checked.size == (568, 205) and checked.format == "JPEG"
              print(f"PASS {output}: 568x205; no caption added; no white canvas margin")

          # Source art from before the accidental five-image montage replacement.
          # bottom is the last row of this track's own scene (next-panel strips omitted).
          settings = {
              "monsoon-ruins": (187, (366, 0, 568, 41)),
              "skyfall-archipelago": (170, (366, 0, 568, 32)),
              "stormline-megacity": (193, None),
              "volcanic-crown": (180, None),
          }
          for name, (bottom, label_rect) in settings.items():
              img = read(HISTORIC, f"public/track-teasers/{name}.jpg")
              if label_rect:
                  bgr = cv2.cvtColor(np.asarray(img), cv2.COLOR_RGB2BGR)
                  mask = np.zeros(bgr.shape[:2], dtype=np.uint8)
                  x0, y0, x1, y1 = label_rect
                  mask[y0:y1, x0:x1] = 255
                  bgr = cv2.inpaint(bgr, mask, 5, cv2.INPAINT_TELEA)
                  img = Image.fromarray(cv2.cvtColor(bgr, cv2.COLOR_BGR2RGB))
              # Preserve the entire horizontal scene; exclude the next map below it.
              img = img.crop((0, 0, img.width, bottom)).resize((568, 205), R)
              write(name, img)

          # Frostbite: use the original cinematic Frostbite concept scene, not the
          # low-poly screenshot or the earlier white-bordered title montage.
          src = read("FETCH_HEAD", "docs/designs/new-tracks/stage-2/source-concept-jpeg/frostbite-canyon/concept-view-02.jpg")
          w, h = src.size
          # Remove the preceding scene's header at the top and any bottom footer.
          top = max(45, int(h * 0.12))
          bottom = min(h - 10, int(h * 0.96))
          band_height = bottom - top
          target_w = round(band_height * 568 / 205)
          if target_w <= w:
              left = max(0, (w - target_w) // 2)
              src = src.crop((left, top, left + target_w, bottom))
          else:
              src = src.crop((0, top, w, bottom))
          write("frostbite-canyon", src.resize((568, 205), R))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/track-teasers/{monsoon-ruins,skyfall-archipelago,stormline-megacity,volcanic-crown,frostbite-canyon}.jpg
          git rm -- .github/workflows/track-teaser-oneoff.yml
          git commit -m "fix(assets): preserve original teaser scenes, clean captions and borders"
          git push origin HEAD:develop
