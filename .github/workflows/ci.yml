# Check main and feature branches (except disabled MODE-00) / PR; deploy only on main dispatch or release tags.
name: CI

on:
  push:
    # Every new feature branch gets the same gate; the retired MODE-00 branch
    # remains excluded per its explicit CI-stop request.
    branches:
      - main
      - 'feature/**'
      - 'refactor/**'
      - fix/home-showcase-camera-parity
      - '!feature/mode00-objective-contract'
    tags: ['v*']
  pull_request:
  # Workflow dispatch remains available; an explicit [full-regression] push also enables the full gate.
  workflow_dispatch:
    inputs:
      full_regression:
        description: 'Run browser and World Tour suites for final refactor verification'
        type: boolean
        default: true

# A newer run of the same event on the same ref makes the older one moot. Keying on the event keeps a push from
# cancelling a manual deploy; tags are unique refs, so releases are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# `/release` pushes `docs: release X` to main and its tag together. The tag run covers that commit (unit tests,
# release-verified, deploy), so every job skips the main-push run of the same commit; the browser suites also skip
# tag runs, because release-verified proves the code already passed them on main.
jobs:
  unit-tests:
    if: "${{ !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'docs: release ')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Strict TS + real Vue SFC template semantic check + documented JS islands.
      - run: npm run typecheck
      - run: npm test

  # CPU-only WebGL makes the serial suite take about two hours on one runner; shards run it in parallel. Playwright
  # splits the alphabetical test list into equal contiguous slices, so more shards also keep one heavy spec file
  # from dominating a slice.
  browser-tests:
    if: "${{ !startsWith(github.ref, 'refs/tags/') && !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'docs: release ')) && (!startsWith(github.ref, 'refs/heads/refactor/') || ((github.event_name == 'workflow_dispatch' && inputs.full_regression == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-regression]')))) }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright uses the runner's preinstalled Google Chrome (channel: 'chrome').
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/8
      # Persist structured ten-track snapshots BEFORE test:layout (Playwright cleans test-results).
      - name: Upload structured WebGL performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-performance-${{ matrix.shard }}
          path: test-results/**/render-performance-*.json
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: test-results
      - name: Upload actual race-mode game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-mode-screenshots-${{ matrix.shard }}
          path: test-results/race-mode-*.png
          if-no-files-found: ignore
      - name: Upload real post-finish interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finish-interaction-screenshots-${{ matrix.shard }}
          path: test-results/**/tokyo-finish-controls.png
          if-no-files-found: ignore

      - name: Upload actual World Tour screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-tour-screenshots-${{ matrix.shard }}
          path: test-results/**/world-tour-*.png
          if-no-files-found: ignore

  cloud-save:
    if: "${{ !startsWith(github.ref, 'refs/tags/') && !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'docs: release ')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - env:
          FIREBASE_CLI_DISABLE_TELEMETRY: '1'
        run: npm run test:cloud
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-save-failures
          path: test-results

      # Phase 5 and final refactors run responsive layout once, with the browser quality gate.
      - name: Verify responsive layout for final refactor or World Tour polish
        if: "${{ matrix.shard == 1 && (startsWith(github.ref, 'refs/heads/refactor/') || (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/phase5-world-tour-polish' || github.ref == 'refs/heads/feature/all-tracks-render-cache')) }}"
        run: npm run test:layout

  # Catch WebGL crashes that short preview tests miss when the player reaches
  # the middle of all five long World Tour routes. Test-only Vite fixture:
  # it is not included in the distributable production build.
  world-tour-mid-race:
    if: "${{ !startsWith(github.ref, 'refs/tags/') && !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'docs: release ')) && (!startsWith(github.ref, 'refs/heads/refactor/') || ((github.event_name == 'workflow_dispatch' && inputs.full_regression == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-regression]')))) }}"
    runs-on: ubuntu-latest
    # CPU-only WebGL renders the ~230 per-map camera tests (about 150k frames) at ~9 fps, hours on one runner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --config=playwright.world-tour.config.js --shard=${{ matrix.shard }}/6
      - name: Upload real mid-race WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-tour-mid-race-screenshots-${{ matrix.shard }}
          path: test-results/**/world-tour-*-mid-race.png
          if-no-files-found: ignore

  # Coast-only A/B screenshots use actual WebGL from the exact integrated
  # main SHA and the current feature build. Never call the showcase shot a before-code screenshot.
  coast-visual-evidence:
    if: "${{ github.ref == 'refs/heads/feature/phase2-coast-visual-quality' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build main baseline from the exact integrated parent
        env:
          BASELINE_SHA: 3788ca36ce52ceb0a304555e5f1dcc564d8181ef
        run: |
          git fetch --no-tags --depth=1 origin "$BASELINE_SHA"
          git worktree add --detach "$RUNNER_TEMP/coast-reference" "$BASELINE_SHA"
          (cd "$RUNNER_TEMP/coast-reference" && npm ci && npm run build)
      - name: Capture unchanged main BEFORE
        env:
          COAST_BASELINE: '1'
          COAST_PREVIEW_DIR: ${{ runner.temp }}/coast-reference/dist
        run: npx playwright test tests/coast-visual-browser.spec.js
      - name: Preserve genuine BEFORE screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coast-webgl-before-main-3788ca36
          path: test-results/**/coast-visual-before-*.png
          if-no-files-found: warn
      - name: Capture Phase 2 AFTER
        run: npx playwright test tests/coast-visual-browser.spec.js
      - name: Preserve genuine AFTER screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coast-webgl-after
          path: test-results/**/coast-visual-after-*.png
          if-no-files-found: warn
      # Playwright cleans test-results at the start of each suite: archive screenshots first.
      - run: npm run test:layout

  # A single required status for every feature branch and normal main push.
  # A branch ruleset can require this job; no direct-push protection is implied
  # by the workflow file alone.
  quality-gate:
    needs: [unit-tests, browser-tests, cloud-save, world-tour-mid-race, coast-visual-evidence]
    if: "${{ always() && !startsWith(github.ref, 'refs/tags/') && !(github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'docs: release ')) }}"
    runs-on: ubuntu-latest
    steps:
      # Auto-verify complete evidence and produce per-track performance Markdown.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: render-performance-*
          path: ${{ runner.temp }}/render-performance
          merge-multiple: true
      - name: Verify software-WebGL evidence coverage and rendering budgets
        run: node scripts/verify-performance-evidence.mjs "${{ runner.temp }}/render-performance"
      - name: Require every verification suite to pass
        env:
          UNIT: ${{ needs.unit-tests.result }}
          BROWSER: ${{ needs.browser-tests.result }}
          CLOUD: ${{ needs.cloud-save.result }}
          WORLD_TOUR: ${{ needs.world-tour-mid-race.result }}
          COAST: ${{ needs.coast-visual-evidence.result }}
          PHASE2: ${{ github.ref == 'refs/heads/feature/phase2-coast-visual-quality' }}
          FOCUSED: ${{ startsWith(github.ref, 'refs/heads/refactor/') && !((github.event_name == 'workflow_dispatch' && inputs.full_regression == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-regression]'))) }}
        run: |
          printf 'unit=%s browser=%s cloud=%s world-tour=%s\\n' "$UNIT" "$BROWSER" "$CLOUD" "$WORLD_TOUR"
          if [ "$FOCUSED" = 'true' ]; then
            for result in "$UNIT" "$CLOUD"; do
              if [ "$result" != success ]; then
                echo "::error::Focused refactor CI requires typecheck/unit and cloud-save."
                exit 1
              fi
            done
            for result in "$BROWSER" "$WORLD_TOUR"; do
              if [ "$result" != skipped ]; then
                echo "::error::Browser and World Tour must be skipped in focused refactor CI."
                exit 1
              fi
            done
            echo "::notice::Focused verification only; full regression remains mandatory before final acceptance."
            exit 0
          fi
          if [ "$PHASE2" = true ] && [ "$COAST" != success ]; then
            echo "::error::Phase 2 requires exact-main Coast BEFORE/AFTER WebGL captures and layout checks."
            exit 1
          fi
          for result in "$UNIT" "$BROWSER" "$CLOUD" "$WORLD_TOUR"; do
            if [ "$result" != success ]; then
              echo "::error::All four required CI suites must succeed on this commit."
              exit 1
            fi
          done

  # A release tag sits on `docs: release X`, a notes/version commit above code that already passed the full suite on
  # main. Re-running two runner-hours of CPU WebGL there only adds a chance that a timing flake leaves the tag
  # unpublished; instead confirm that main run and go straight to deploy. scripts/release-gate.sh enforces the same
  # rule before a tag is ever created.
  release-verified:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit to vouch for: the tagged one, or the nearest ancestor below its `docs: release` commits.
          code=$(git log -1 --format=%H --invert-grep --grep='^docs: release ' HEAD)
          extra=$(git diff --name-only "$code" HEAD | grep -vxE 'CHANGELOG\.md|package\.json|package-lock\.json' || true)
          if [ -n "$extra" ]; then echo "::error::release commits above $code change more than the release files: $extra"; exit 1; fi
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$code" --status success --limit 1 --json url --jq '.[0].url')
          if [ -z "$run" ]; then echo "::error::$code has no successful CI run on main; push it to main, let CI pass, then tag"; exit 1; fi
          echo "$code passed CI on main: $run"

  deploy:
    # A tag run skips browser and cloud suites; a manual run skips release-verified.
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) && needs.unit-tests.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.browser-tests.result) && contains(fromJSON('["success", "skipped"]'), needs.cloud-save.result) && contains(fromJSON('["success", "skipped"]'), needs.world-tour-mid-race.result) && contains(fromJSON('["success", "skipped"]'), needs.quality-gate.result) && contains(fromJSON('["success", "skipped"]'), needs.release-verified.result) }}
    needs: [unit-tests, browser-tests, cloud-save, world-tour-mid-race, quality-gate, release-verified]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Call vite directly: `npm run build -- --base=...` hands --base to the assert script, not vite.
      - run: npx vite build --base=/skyline-rush/ && node scripts/assert-production-locked.mjs
      - name: Check asset paths match the Pages base
        run: |
          for p in $(grep -oE '(src|href)="/[^"]*"' dist/index.html | cut -d'"' -f2); do
            case "$p" in
              /skyline-rush/*) f="dist/${p#/skyline-rush/}"; test -f "${f%%\?*}" || { echo "missing in dist: $p"; exit 1; } ;;
              *) echo "not under /skyline-rush/: $p"; exit 1 ;;
            esac
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public website
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        # The title alone passes on a blank page; also require the new entry script to be served.
        run: |
          js=$(grep -oE 'src="[^"]*\.js"' dist/index.html | cut -d'"' -f2)
          origin=$(echo "$PAGE_URL" | grep -oE '^https?://[^/]+')
          for i in 1 2 3 4 5 6; do
            html=$(curl --fail --silent --show-error "$PAGE_URL") && grep -q 'Skyline Rush' <<<"$html" && grep -qF "$js" <<<"$html" && break
            [ "$i" = 6 ] && { echo "page missing $js"; exit 1; }; sleep 10
          done
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$origin$js"

  # Failure-only pager: a notification on every push is one nobody reads. Credentials live in repo secrets
  # (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID). Pull requests are excluded because fork PRs get no secrets.
  notify-telegram:
    needs: [unit-tests, browser-tests, cloud-save, world-tour-mid-race, release-verified, deploy]
    if: ${{ failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Unset secrets (a fork, or a clone never configured) skip quietly instead of adding a second red X.
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skipping notification"
            exit 0
          fi
          # parse_mode=HTML: a branch containing < & > would otherwise make Telegram reject the message.
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          ci_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message="🚨 <b>CI failed</b>

          <b>Repository:</b> <code>$(esc "$GITHUB_REPOSITORY")</code>
          <b>Branch:</b> <code>$(esc "$GITHUB_REF_NAME")</code>
          <b>Event:</b> <code>$(esc "$GITHUB_EVENT_NAME")</code>
          <b>Commit:</b> <code>$(esc "${GITHUB_SHA::7}")</code>

          <a href=\"$ci_url\">Open failed CI run</a>"
          curl --fail --silent --show-error --max-time 30 \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=$message" \
            "https://api.telegram.org/bot$TOKEN/sendMessage"
