# Check every push / PR; publish GitHub Pages on version tags or manual dispatch.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer run of the same event on the same ref makes the older one moot. Keying on the event keeps a push from
# cancelling a manual deploy; tags are unique refs, so releases are never cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # CPU-only WebGL makes the serial suite take ~24 min on one runner; shards run it in parallel.
  browser-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright uses the runner's preinstalled Google Chrome (channel: 'chrome').
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: test-results
      - name: Upload actual World Tour screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-tour-screenshots-${{ matrix.shard }}
          path: artifacts/world-tour/*.png
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [unit-tests, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Call vite directly: `npm run build -- --base=...` hands --base to the assert script, not vite.
      - run: npx vite build --base=/skyline-rush/ && node scripts/assert-production-locked.mjs
      - name: Check asset paths match the Pages base
        run: |
          for p in $(grep -oE '(src|href)="/[^"]*"' dist/index.html | cut -d'"' -f2); do
            case "$p" in
              /skyline-rush/*) f="dist/${p#/skyline-rush/}"; test -f "${f%%\?*}" || { echo "missing in dist: $p"; exit 1; } ;;
              *) echo "not under /skyline-rush/: $p"; exit 1 ;;
            esac
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public website
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        # The title alone passes on a blank page; also require the new entry script to be served.
        run: |
          js=$(grep -oE 'src="[^"]*\.js"' dist/index.html | cut -d'"' -f2)
          origin=$(echo "$PAGE_URL" | grep -oE '^https?://[^/]+')
          for i in 1 2 3 4 5 6; do
            html=$(curl --fail --silent --show-error "$PAGE_URL") && grep -q 'Skyline Rush' <<<"$html" && grep -qF "$js" <<<"$html" && break
            [ "$i" = 6 ] && { echo "page missing $js"; exit 1; }; sleep 10
          done
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$origin$js"
