name: Rewards native 3x PNG export
on:
  push:
    branches: [feature/garage-rewards-and-missions]
    paths:
      - .github/workflows/rewards-png-export.yml
      - scripts/export-rewards-png.py
      - public/feature-assets/garage-rewards-and-missions/raster/*.webp
permissions:
  contents: write
jobs:
  export:
    if: github.repository == 'weskao/skyline-rush'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Re-export and audit eight independent PNG sources
        run: python scripts/export-rewards-png.py
      - name: Commit formal PNGs to the authorized branch only
        run: |
          set -euo pipefail
          git add public/feature-assets/garage-rewards-and-missions/raster/*.png
          if git diff --staged --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'art(wave3): export native transparent PNGs [full-regression]'
          git push origin HEAD:feature/garage-rewards-and-missions
