name: Tokyo Hyperdrive Gameplay Media
on:
  push:
    branches:
      - feature/tokyo-hyperdrive-sectors
    paths:
      - scripts/capture-tokyo-hyperdrive.mjs
      - .github/workflows/tokyo-media.yml
  workflow_dispatch:
permissions:
  contents: write

jobs:
  real-gameplay-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install system FFmpeg for MP4 encoding
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Capture actual Tokyo gameplay from this branch
        run: node scripts/capture-tokyo-hyperdrive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokyo-hyperdrive-media
          path: artifacts/tokyo-hyperdrive/
          if-no-files-found: warn
      - name: Publish media on the feature branch for inline GitHub preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/tokyo-hyperdrive/*.png artifacts/tokyo-hyperdrive/*.mp4
          git commit -m "docs(media): capture real Tokyo Hyperdrive gameplay [skip ci]"
          git push origin HEAD:refs/heads/feature/tokyo-hyperdrive-sectors
