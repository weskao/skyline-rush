name: Temporary teaser vehicle-removal preview
on:
  push:
    paths:
      - .github/workflows/track-teaser-vehicle-removal-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster libraries
        run: python -m pip install --quiet "numpy<2" pillow opencv-python-headless==4.10.0.84 simple-lama-inpainting
      - name: Inpaint ONLY vehicle and exhaust regions
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np
          from PIL import Image, ImageChops
          from simple_lama_inpainting import SimpleLama
          model=SimpleLama()

          root=Path("public/track-teasers")
          output=Path("teaser-inpaint-preview")
          output.mkdir(exist_ok=True)

          # Precise polygons around the on-screen car body and nitro exhaust.
          # No crop / camera rotation / global AI redraw is applied.
          masks={
            "skyfall-archipelago": [
              [(156,135),(181,125),(216,128),(257,142),(276,166),(262,181),(221,187),(188,173),(146,177)],
              [(170,168),(194,159),(223,174),(205,205),(129,205)],
              [(220,169),(243,154),(263,169),(258,205),(197,205)]
            ],
            "stormline-megacity": [
              [(187,114),(223,103),(258,111),(299,128),(313,155),(298,171),(256,170),(237,164),(202,174),(174,160)],
              [(209,161),(240,160),(254,177),(244,205),(177,205)],
              [(267,162),(290,162),(296,180),(297,205),(242,205)]
            ],
            "volcanic-crown": [
              [(194,132),(219,119),(252,119),(293,134),(311,153),(305,176),(271,187),(236,180),(207,174),(185,164)],
              [(215,163),(244,160),(266,185),(247,205),(166,205)],
              [(272,164),(297,169),(315,205),(247,205)]
            ],
            "frostbite-canyon": [
              [(382,126),(409,111),(447,113),(481,123),(506,139),(519,168),(507,185),(474,184),(435,169),(386,169),(367,151)],
              [(448,160),(483,155),(524,177),(552,205),(446,205)]
            ]
          }
          for name,polygons in masks.items():
              path=root/f"{name}.jpg"
              import shutil
              shutil.copy2(path, output / f"{name}-original.jpg")
              rgb=np.asarray(Image.open(path).convert("RGB"))
              h,w=rgb.shape[:2]
              assert (w,h)==(568,205),(name,(w,h))
              mask=np.zeros((h,w),dtype=np.uint8)
              for poly in polygons:
                  cv2.fillPoly(mask,[np.array(poly,dtype=np.int32)],255)
              mask=cv2.dilate(mask,cv2.getStructuringElement(cv2.MORPH_ELLIPSE,(7,7)))
              edited=np.asarray(model(Image.fromarray(rgb),Image.fromarray(mask).convert("L")).convert("RGB"))[:h,:w]
              restored=cv2.cvtColor(np.where(mask[:,:,None]>0,edited,rgb).astype(np.uint8),cv2.COLOR_RGB2BGR)
              if name=="volcanic-crown":
                  # Top-right accidental dark bar, not a landscape feature.
                  top=np.zeros_like(mask)
                  top[0:8,518:568]=255
                  restored=cv2.inpaint(restored,top,3,cv2.INPAINT_TELEA)
                  mask=np.maximum(mask,top)
              Image.fromarray(cv2.cvtColor(restored,cv2.COLOR_BGR2RGB)).save(output/f"{name}.jpg",quality=94,optimize=True)
              Image.fromarray(mask).save(output/f"{name}-mask.png")
              print(name,"pixels masked",int(np.count_nonzero(mask)), "dimensions", (w,h))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: teaser-vehicle-removal-preview
          path: teaser-inpaint-preview/
          retention-days: 1
