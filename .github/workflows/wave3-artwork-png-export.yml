name: Wave3 A05 A06 PNG Export (temporary)
on:
  push:
    branches: [feature/wave3-wallet-ui-polish]
    paths: [.github/workflows/wave3-artwork-png-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PNG converter
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Convert committed artwork and emit recoverable PNG pixels
        shell: bash
        run: |
          set -euo pipefail
          for name in demo-collection-empty demo-results-banner; do
            src="public/feature-assets/wave3-demo/raster/${name}@3x.webp"
            target="/tmp/${name}.png"
            python - "$src" "$name" <<'PY'
          import base64, io, sys, textwrap
          from PIL import Image
          output = io.BytesIO()
          Image.open(sys.argv[1]).convert('RGBA').save(output, format='PNG', optimize=True)
          payload = base64.b64encode(output.getvalue()).decode()
          print("@@WAVE3_PNG_BEGIN_" + sys.argv[2] + "@@")
          print("\n".join(textwrap.wrap(payload, 400)))
          print("@@WAVE3_PNG_END_" + sys.argv[2] + "@@")
          PY
          done
