name: Generate Garage source-art animated GIFs

on:
  push:
    branches: [feature/garage-preview-animated-gifs]
    paths:
      - scripts/generate-garage-gifs.py
      - tests/test_garage_gif_motion.py
      - .github/workflows/garage-animated-gifs.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garage-art-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/feature/garage-preview-animated-gifs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image generation libraries
        run: python -m pip install 'numpy>=2.0,<3' 'Pillow>=11.3,<13' 'CairoSVG>=2.7,<3'
      - name: Test real source geometry, independent parts and 25 art directions
        run: python -m unittest discover -s tests -p test_garage_gif_motion.py -v
      - name: Animate real checked-in transparent WebP and SVG artwork
        run: python scripts/generate-garage-gifs.py
      - name: Verify all 25 exported files before committing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          files = json.loads(Path('public/feature-assets/garage-animated/manifest.json').read_text())
          assert len(files) == 25
          from PIL import ImageSequence
          import numpy as np
          assert len({item['name'] for item in files}) == 25
          assert len({item['category'] for item in files}) == 5
          for item in files:
              gif = Image.open(item['file'])
              assert gif.n_frames == 20 and gif.info['loop'] == 0 and item['frames'] == 20
              assert item['fps'] == 20 and item['profile'] == 'gpt-authored'
              assert Path(item['file']).stat().st_size < 900000
              assert gif.size == (item['width'], item['height'])
              assert item['size'] == Path(item['file']).stat().st_size
              for frame in ImageSequence.Iterator(gif):
                  assert frame.info['duration'] == 50
                  a = np.asarray(frame.convert('RGBA'))[:,:,3]
                  ys,xs=np.where(a > 16)
                  assert len(xs) > 0
                  m = 20 if item['width'] == 216 else 12
                  assert min(xs.min(),ys.min(),item['width']-1-xs.max(),item['height']-1-ys.max()) >= m
          print('Verified source-linked GIFs:', len(files))
          PY
      - name: Commit generated binaries to the sole authorized branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/feature-assets/garage-animated/ docs/designs/garage-animated-gifs/qa-contact-sheets/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: commit 25 original-art Garage animations'
            git push origin HEAD:feature/garage-preview-animated-gifs
          fi
