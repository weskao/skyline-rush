name: Rebuild clipped HUD source images
on:
  push:
    branches:
      - fix/wave3-hud-artwork-completeness
    paths:
      - docs/designs/3x-asset-library/generate-hud-art.py
      - .github/workflows/wave3-hud-rebuild.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wave3-hud-rebuild
  cancel-in-progress: false
jobs:
  rewrite-existing-webp:
    if: github.ref == 'refs/heads/fix/wave3-hud-artwork-completeness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wave3-hud-artwork-completeness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow for native-resolution rendering
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Regenerate and audit all 18 complete 3x WebP assets
        run: python docs/designs/3x-asset-library/generate-hud-art.py
      - name: Overwrite original image paths on this feature branch only
        run: |
          git add public/feature-assets/mobile-controls-hud/raster/*@3x.webp
          test "$(git diff --cached --name-only | wc -l)" -eq 18
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'fix(art): replace 18 clipped HUD controls with complete 3x WebP'
          git push origin HEAD:refs/heads/fix/wave3-hud-artwork-completeness
