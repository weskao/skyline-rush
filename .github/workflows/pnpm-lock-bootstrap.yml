# Temporary one-shot migration tool; remove after the generated lockfile passes CI.
name: Bootstrap pnpm lockfile (temporary)
on:
  push:
    branches: ['feature/pnpm-migration']
    paths: ['.github/workflows/pnpm-lock-bootstrap.yml']
concurrency:
  group: pnpm-lock-bootstrap
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.13 --activate
          pnpm --version
      - name: Import npm lock and validate frozen install
        run: |
          git fetch --quiet origin feature/pnpm-migration
          git checkout -B feature/pnpm-migration origin/feature/pnpm-migration
          pnpm import
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Commit the real pnpm lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 1
          git commit -m 'chore: generate pnpm lockfile [pnpm-lock-generated]'
          for attempt in 1 2 3; do
            git fetch origin feature/pnpm-migration
            git rebase origin/feature/pnpm-migration || exit 1
            if git push origin HEAD:feature/pnpm-migration; then exit 0; fi
          done
          exit 1
