name: Finish HUD original bezel inpainting (one-time)
on:
  push:
    branches: [fix/wave3-hud-artwork-completeness]
    paths: [.github/workflows/repair-hud-backing-edge.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hud-backing-edge-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/wave3-hud-artwork-completeness'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wave3-hud-artwork-completeness
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned original Git artwork
        run: |
          git fetch --no-tags --depth=1 origin f67d3bf31012edfa52cc06f46abe586ad5bdd78e
          python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: RED - prior images must differ from correctly inpainted originals
        run: |
          if python scripts/repair-hud-original-art.py --check > "$RUNNER_TEMP/before.log" 2>&1; then
            echo 'Expected old flat/seamed bezels to fail the new pixel gate' >&2
            exit 1
          fi
      - name: GREEN - rebuild lossless originals, check 3x image size and source identity
        run: |
          python scripts/repair-hud-original-art.py
          python scripts/repair-hud-original-art.py --check
          node --test tests/hud-original-artwork-regression.test.js tests/module-size.test.js
          git diff --check
      - name: Commit artwork in place and remove workflow
        run: |
          git add public/feature-assets/mobile-controls-hud/raster/*@3x.webp
          git rm .github/workflows/repair-hud-backing-edge.yml
          test "$(git diff --cached --name-only | grep -c '@3x.webp$')" -ge 3
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'fix(art): restore original full-size HUD button bevels without seams'
          git push origin HEAD:refs/heads/fix/wave3-hud-artwork-completeness
