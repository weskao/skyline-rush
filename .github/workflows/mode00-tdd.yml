name: MODE-00 TDD
on:
  push:
    branches: [feature/mode00-objective-contract]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mode00-tdd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: MODE-00 focused regression
        run: node --test tests/mode00-streams.test.js
      - name: Full unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Race modes WebGL smoke (desktop)
        run: npx playwright test tests/race-modes-browser.spec.js -g "Checkpoint Rush|Elimination|Obstacle Run"
      - name: Mode History and PB WebGL browser regression
        run: npx playwright test tests/mode-history-browser.spec.js
      - name: Upload real mode screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mode00-webgl-screenshots
          path: test-results/race-mode-*.png
          if-no-files-found: ignore

  # The complete suite mirrors ci.yml on main. Do not rely on smoke-only
  # verification when integrating new mode UI, WebGL, and persistence behavior.
  full-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/8
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mode00-browser-failures-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  world-tour-mid-race:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --config=playwright.world-tour.config.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mode00-world-tour-failures
          path: test-results
          if-no-files-found: ignore
