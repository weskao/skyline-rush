name: Final monsoon caption artifact repair
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/monsoon-caption-final.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore natural background only behind the monsoon caption
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pillow numpy
          git fetch origin feature/epic-home-art-monsoon-ruins
          python - <<'PY'
          from PIL import Image
          import numpy as np
          import io, subprocess

          def read(ref,path):
              return Image.open(io.BytesIO(subprocess.check_output(["git","show",f"{ref}:{path}"]))).convert("RGB")
          path = "public/track-teasers/monsoon-ruins.jpg"
          orig = read("4b94bdabf9fa5030045646e04a45a4aef549edc3", path)
          orig = orig.crop((0,3,568,187)).resize((568,205),Image.Resampling.LANCZOS)
          # Same-track high-resolution source used only as a natural texture patch.
          alt = read("FETCH_HEAD", path)
          w,h=alt.size
          wanted_h = round(w*205/568)
          if wanted_h <= h:
              top=(h-wanted_h)//2
              alt = alt.crop((0,top,w,top+wanted_h))
          alt=alt.resize((568,205),Image.Resampling.LANCZOS)
          a=np.asarray(orig).astype(np.float32).copy()
          b=np.asarray(alt).astype(np.float32)
          # Match color/illumination across the seam to preserve the original scene.
          x0,x1,y0,y1=364,568,3,51
          base_patch=a[y0:y1,x0:x1]
          donor_patch=b[y0:y1,x0:x1]
          donor_mean=donor_patch.mean((0,1),keepdims=True)
          target_mean=np.concatenate((a[52:65,365:568],a[3:13,365:568]),axis=0).mean((0,1),keepdims=True)
          adjusted=np.clip(donor_patch+(target_mean-donor_mean)*0.5,0,255)
          for y in range(y0,y1):
              fade_y=min(1.,(y-y0)/10.,(y1-y)/12.)
              for x in range(x0,x1):
                  fade_x=min(1.,(x-x0)/14.)
                  alpha=max(0.,min(fade_x,fade_y))
                  a[y,x]=a[y,x]*(1-alpha)+adjusted[y-y0,x-x0]*alpha
          result=Image.fromarray(np.uint8(np.clip(a,0,255)))
          assert result.size==(568,205)
          result.save(path,"JPEG",quality=89,subsampling=0,optimize=True)
          with Image.open(path) as check:
              assert check.size==(568,205) and check.format=="JPEG"
          print("PASS caption repair:",path)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/track-teasers/monsoon-ruins.jpg
          git rm .github/workflows/monsoon-caption-final.yml
          git commit -m "fix(assets): restore natural monsoon sky behind removed caption"
          git push origin HEAD:develop
