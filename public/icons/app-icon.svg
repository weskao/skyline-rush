<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Skyline Rush app icon</title>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#294659"/>
      <stop offset=".55" stop-color="#101b26"/>
      <stop offset="1" stop-color="#080f1a"/>
    </linearGradient>
    <linearGradient id="rush" x1="0" y1="1" x2=".8" y2="0">
      <stop stop-color="#ff604e"/>
      <stop offset=".6" stop-color="#ff805e"/>
      <stop offset="1" stop-color="#ffd09a"/>
    </linearGradient>
    <linearGradient id="wake">
      <stop stop-color="#76d9e7" stop-opacity="0"/>
      <stop offset="1" stop-color="#76d9e7" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#night)"/>
  <path d="M144 473h184M115 525h178M161 577h101" stroke="url(#wake)" stroke-width="12" stroke-linecap="round"/>
  <g transform="translate(174 147) scale(18)">
