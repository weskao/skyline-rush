<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixed-step thermal baseline scene probe</title>
<style>html,body{margin:0;background:#081428}canvas{display:block;width:100vw;height:100vh}output{position:fixed;top:0;left:0;color:white}</style></head>
<body>
<canvas id="world" aria-label="Thermal baseline scene probe"></canvas>
<output id="perf-overlay"></output>
<script type="module">
  import { createWorld } from '../../src/world.js';
  import { createRace } from '../../src/race-factory.ts';
  import { startRace, stepRace, setLayoutSeed } from '../../src/game.js';
  import { thermalScenarios } from './thermal-scenarios.js';
  import { CIRCUIT_ID } from '../../src/circuit-track.ts';
  import { vfxSettings } from '../../src/vfx-settings.ts';
  import { createPresentation } from '../../src/presentation.ts';
  import { untilDrawn } from './showcase-probe-draw.js';
  const STEP = 1/60, SEED = 12345, INPUT = Object.freeze({ throttle: true, boost: true, steer: 0 });
  const next = () => new Promise(requestAnimationFrame);
  window.thermalScenarios = thermalScenarios;
  window.thermalRun = async ({ id, phase, frames = 180 }) => {
    const world = createWorld(document.getElementById('world'), vfxSettings({ quality: 'high', preset: 'cinematic' }));
    const perf = world.deepPerf;
    if (!perf) throw Error('Probe requires ?perf=deep');
    try {
      setLayoutSeed(() => SEED);
      const track = phase === 'showcase' ? 'coast' : id;
      const race = createRace(track, track === CIRCUIT_ID ? { mode: 'circuit', laps: 3 } : null);
      const presentation = createPresentation();
      if (phase === 'showcase' && !world.setUpcomingTrack(id)) throw Error('Unavailable 3D showcase: ' + id);
      world.preloadTrackAssets(track);
      await untilDrawn(() => world.render(race, STEP, 2, {}));
      if (phase === 'racing') {
        startRace(race);
        await untilDrawn(() => world.render(race, STEP, 0, {}));
        while (race.phase === 'countdown') stepRace(race, {}, STEP);
        // Settle the chase camera with identical fixed steps, not a wall-clock warmup.
        for (let i = 0; i < 60; i++) {
          await next(); stepRace(race, INPUT, STEP);
          world.render(race, STEP, 0, INPUT, presentation.update(race, STEP));
        }
      }
      let previous = await next(), drawnCount = 0;
      const startDistance = race.player.distance, started = performance.now();
      for (let i = 0; i < frames; i++) {
        const now = await next();
        perf.start(now, (now - previous) / 1000, race.phase, id); previous = now;
        if (phase === 'racing') stepRace(race, INPUT, STEP);
        perf.simulationDone();
        const begin = performance.now();
        const drawn = world.render(race, STEP, phase === 'racing' ? 0 : 2 + i * STEP, INPUT, presentation.update(race, STEP));
        if (drawn) { drawnCount++; perf.submission(performance.now() - begin); }
        perf.finish(drawn, 60, 1);
      }
      return { scenario: phase, track: id, seed: SEED, input: INPUT, camera: 'default-drive-fixed-step',
        requestedFrames: frames, drawnCount, wallSeconds: (performance.now() - started)/1000,
        startDistance, endDistance: race.player.distance, endPhase: race.phase,
        diagnostics: perf.snapshot() };
    } finally { world.dispose(); }
  };
</script>
</body></html>
