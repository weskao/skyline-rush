<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Draw-call attribution probe</title>
<style>html,body{margin:0;background:#081428}canvas{display:block;width:100vw;height:100vh}output{position:fixed;top:0;left:0;color:white}</style></head>
<body>
<canvas id="world" aria-label="Draw-call attribution probe"></canvas>
<output id="perf-overlay"></output>
<script type="module">
  // Same fixed-step loop as thermal-baseline.html; on the last frame every renderBufferDirect call is
  // attributed to a pass (shadow / scene / post) and to its source (nearest named ancestors).
  import * as THREE from 'three';
  import { createWorld } from '../../src/world.js';
  import { createRace } from '../../src/race-factory.ts';
  import { startRace, stepRace, setLayoutSeed } from '../../src/game.js';
  import { thermalScenarios } from './thermal-scenarios.js';
  import { CIRCUIT_ID } from '../../src/circuit-track.ts';
  import { vfxSettings } from '../../src/vfx-settings.ts';
  import { createPresentation } from '../../src/presentation.ts';
  import { untilDrawn } from './showcase-probe-draw.js';
  const STEP = 1/60, SEED = 12345, INPUT = Object.freeze({ throttle: true, boost: true, steer: 0 });
  const next = () => new Promise(requestAnimationFrame);
  let renderer = null, log = null;
  THREE.Scene.prototype.onBeforeRender = function (r) {
    if (renderer) return;
    renderer = r;
    const direct = r.renderBufferDirect.bind(r);
    r.renderBufferDirect = (camera, scene, geometry, material, object, group) => {
      if (log) log.push(describe(camera, material, object, geometry, group));
      return direct(camera, scene, geometry, material, object, group);
    };
  };
  const names = object => {
    const out = [];
    for (let o = object; o && !o.isScene; o = o.parent) if (o.name) out.push(o.name.replace(/[-:#]\d+$/, ''));
    return out;
  };
  function describe(camera, material, object, geometry, group) {
    const shadow = material.isMeshDepthMaterial || material.isMeshDistanceMaterial;
    const target = renderer.getRenderTarget();
    const pass = shadow ? 'shadow' : camera.isPerspectiveCamera ? (target ? 'scene' : 'scene-direct') : 'post';
    const chain = names(object);
    const top = []; for (let o = object; o && !o.isScene; o = o.parent) top.unshift(o.name || o.type);
    return { pass, source: chain.slice(0, 2).reverse().join(' / ') || top.slice(0, 3).join('/'),
      type: object.type, material: material.type, transparent: material.transparent, renderOrder: object.renderOrder,
      instanced: !!object.isInstancedMesh, count: object.count ?? 1, group: !!group,
      geometry: geometry.uuid, mat: material.uuid, color: material.color?.getHexString?.() ?? null,
      vertexColors: !!material.vertexColors, map: !!material.map, castShadow: object.castShadow,
      onBefore: object.onBeforeRender !== THREE.Object3D.prototype.onBeforeRender,
      object: object.uuid, side: material.side, instanceColor: !!object.instanceColor,
      signature: signature(material), attributes: Object.keys(geometry.attributes).sort().join(),
      indexed: !!geometry.index };
  }
  // Everything that shapes a material's shading except its base colour: equal signatures are colour-only variants.
  const signature = material => JSON.stringify(Object.entries(material).filter(([k, v]) =>
    !['uuid', 'id', 'name', 'color', 'version', 'userData', '_listeners', 'uniforms', 'uniformsGroups'].includes(k)
    && typeof v !== 'function').map(([k, v]) => [k, v?.isColor ? v.getHexString() : v?.isTexture ? v.uuid : v?.isEuler ? v.toArray() : v]));
  window.thermalScenarios = thermalScenarios;
  window.drawAttribution = async ({ id, phase, frames = 180 }) => {
    const world = createWorld(document.getElementById('world'), vfxSettings({ quality: 'high', preset: 'cinematic' }));
    try {
      setLayoutSeed(() => SEED);
      const track = phase === 'showcase' ? 'coast' : id;
      const race = createRace(track, track === CIRCUIT_ID ? { mode: 'circuit', laps: 3 } : null);
      const presentation = createPresentation();
      if (phase === 'showcase' && !world.setUpcomingTrack(id)) throw Error('Unavailable 3D showcase: ' + id);
      world.preloadTrackAssets(track);
      await untilDrawn(() => world.render(race, STEP, 2, {}));
      if (phase === 'racing') {
        startRace(race);
        await untilDrawn(() => world.render(race, STEP, 0, {}));
        while (race.phase === 'countdown') stepRace(race, {}, STEP);
        for (let i = 0; i < 60; i++) { await next(); stepRace(race, INPUT, STEP); world.render(race, STEP, 0, INPUT, presentation.update(race, STEP)); }
      }
      for (let i = 0; i < frames; i++) {
        await next();
        if (phase === 'racing') stepRace(race, INPUT, STEP);
        if (i === frames - 1) log = [];
        world.render(race, STEP, phase === 'racing' ? 0 : 2 + i * STEP, INPUT, presentation.update(race, STEP));
      }
      const calls = log; log = null;
      return { id, phase, drawCalls: world.inspectRenderLoad().drawCalls, programs: world.inspectPrograms(), calls };
    } finally { world.dispose(); }
  };
</script>
</body></html>
