<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Skyline Rush player debuff HUD fixture</title>
</head>
<body data-phase="racing">
  <main id="app"></main>
  <script type="module">
    import { createApp, h } from 'vue';
    import '../../src/style.css';
    import '../../src/race-lobby.css';
    import ItemSlot from '../../src/ItemSlot.vue';
    import PlayerHitScreen from '../../src/PlayerHitScreen.vue';
    import RaceHalfway from '../../src/RaceHalfway.vue';
    import RaceSpeedometer from '../../src/RaceSpeedometer.vue';
    import { createRace } from '../../src/game.js';
    import { setLocale } from '../../src/i18n.ts';
    import { stepRivalAttacks } from '../../src/item-attacks.ts';
    import { setupItemUI } from '../../src/item-ui.ts';
    import { createPresentation } from '../../src/presentation.ts';
    import { updateRaceHalfwayView } from '../../src/race-halfway-view.ts';
    import { refreshFoldableViewport } from '../../src/foldable-viewport.ts';

    setLocale(new URLSearchParams(location.search).get('locale'));
    refreshFoldableViewport();
    createApp({ render: () => [h(PlayerHitScreen), h(ItemSlot),h(RaceHalfway), h('footer', { class: 'telemetry' }, [h(RaceSpeedometer)])] }).mount('#app');
    const race = createRace('coast', { mode: 'custom', itemRules: 'all', rivals: 2, traffic: 'off' });
    Object.assign(race, { phase: 'racing', elapsed: 13 });
    const itemUI = setupItemUI({ getRace: () => race, cue: () => {} });
    const presentation = createPresentation(updateRaceHalfwayView);
    const update = () => { presentation.update(race, 0); itemUI.update(race); };
    const hit = (attack, distance) => {
      Object.assign(race.player, { distance, x: 2.5, speed: 40 });
      Object.assign(race.rivals[0], { distance: distance - 20, x: -2.5, heldAttack: attack, attackReadyAt: 0 });
      stepRivalAttacks(race);
      update();
    };
    update();
    window.debuffHud = { race, hit, update };
  </script>
</body>
</html>
