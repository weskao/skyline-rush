<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Showcase camera probe</title>
<style>html,body{margin:0;background:#081428}canvas{display:block;width:100vw;height:100vh}</style></head>
<body>
<canvas id="world" aria-label="Showcase camera regression"></canvas>
<script type="module">
  import * as THREE from 'three';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { shouldDrawShowcaseFrame } from './showcase-probe-draw.js';
  import { createWorld } from '../../src/world.js';
  import { createRace } from '../../src/game.js';
  import { trackFrame } from '../../src/track-paths.ts';
  import { skyFrame } from '../../src/sky-track.ts';
  import { previewDistance } from '../../src/track-preview.ts';
  // The composer's RenderPass owns the live camera (WebGLRenderer.render is an own property, not patchable).
  let liveCamera = null;
  // This fixture checks camera geometry, not animation frame rate. Advance every
  // simulation tick, but avoid hundreds of redundant software-WebGL paints on CI.
  let drawFrame = true;
  const originalComposeRender = EffectComposer.prototype.render;
  EffectComposer.prototype.render = function (...args) {
    if (drawFrame) return originalComposeRender.apply(this, args);
  };
  const originalRender = RenderPass.prototype.render;
  RenderPass.prototype.render = function (...args) {
    liveCamera = this.camera;
    return originalRender.apply(this, args);
  };
  const world = createWorld(document.getElementById('world'));
  const TOUR = new Set(['taipei', 'tokyo', 'alpine', 'coastal', 'cosmic']);
  const roadFrame = (id, distance) => id === 'spiral' ? skyFrame(distance)
    : TOUR.has(id) ? trackFrame(id, distance) : { forward: [0, 0, -1], right: [1, 0, 0] };
  // Camera bearing around the player in its road frame: rear 0°, right 90°, front ±180°, left -90°.
  function bearing(id) {
    const [player] = world.inspectShowcase();
    liveCamera.updateMatrixWorld(true);
    const car = new THREE.Vector3(player.x, player.y, player.z).unproject(liveCamera);
    const offset = liveCamera.position.clone().sub(car);
    const frame = roadFrame(id, previewDistance(id));
    const side = offset.dot(new THREE.Vector3(...frame.right));
    const back = -offset.dot(new THREE.Vector3(...frame.forward));
    return { bearing: Math.atan2(side, back) * 180 / Math.PI, range: Math.hypot(side, back), x: player.x, clear: player.bodyClearShare, carBounds: player.carBounds };
  }
  // Renders `seconds` of ready-screen frames and samples the bearing every `every` seconds.
  // `racing` parks the player at the preview point mid-race, where AIRFLOW views drive the race camera.
  window.showcaseCameraProbe = (id, view, { airflow = false, seconds = 2, every = 0, start = 2, racing = false, quality = 'low' } = {}) => {
    world.configureVFX({ quality, enabled: true, bloom: 0, airflow, view });
    const race = createRace(id);
    if (racing) Object.assign(race, { phase: 'racing', elapsed: start }).player.distance = previewDistance(id);
    const samples = [];
    const frames = Math.round(seconds * 30);
    const stride = every ? Math.max(1, Math.round(every * 30)) : 0;
    try {
      for (let i = 0; i <= frames; i++) {
        drawFrame = shouldDrawShowcaseFrame(i, frames, stride);
        world.render(race, 1 / 30, start + i / 30, {});
        if (stride && i % stride === 0) samples.push(bearing(id));
      }
    } finally {
      drawFrame = true;
    }
    return { ...bearing(id), samples };
  };
  window.showcaseCameraReady = true;
</script>
</body></html>
